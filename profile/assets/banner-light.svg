<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="PodUtils: small, static tools for hosts that say no">
  <defs>
    <radialGradient id="glowA" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#ff9a52" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff9a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#ff6f61" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6f61" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="0.55" stop-color="#ff9a52"/>
      <stop offset="1" stop-color="#ff6f61"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#3b2a1e" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
      .m { font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace; }
      @keyframes breathe { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      .seed2 { transform-box: fill-box; transform-origin: center; animation: breathe 3.6s ease-in-out infinite; }
      .seed3 { transform-box: fill-box; transform-origin: center; animation: breathe 3.6s ease-in-out 1.2s infinite; }
      @media (prefers-reduced-motion: reduce) { .seed2, .seed3 { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#fbf6f0"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <rect width="1280" height="320" fill="url(#glowA)"/>
    <rect width="1280" height="320" fill="url(#glowB)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#efe3d6"/>

  <!-- pod mark -->
  <g transform="translate(964 160) rotate(-18)">
    <rect x="-150" y="-50" width="300" height="100" rx="50" fill="none" stroke="#2a1e16" stroke-opacity="0.85" stroke-width="3"/>
    <circle cx="-88" cy="0" r="28" fill="url(#warm)"/>
    <circle class="seed2" cx="0" cy="0" r="28" fill="url(#warm)"/>
    <circle class="seed3" cx="88" cy="0" r="28" fill="url(#warm)"/>
  </g>

  <!-- wordmark -->
  <text class="t" x="88" y="158" font-size="84" font-weight="700" letter-spacing="-3" fill="#2a1e16">Pod<tspan fill="url(#warm)">Utils</tspan></text>
  <text class="t" x="92" y="208" font-size="26" font-weight="400" fill="#6e5b4b">Small, static tools for hosts that say no.</text>
  <text class="m" x="93" y="256" font-size="15" letter-spacing="3" fill="#a08b78">RUST  ·  STATIC  ·  ROOTLESS  ·  0BSD</text>
</svg>
